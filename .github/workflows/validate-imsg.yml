name: Validate imsg

on:
  pull_request:
    paths:
      - "apps/imsg/**"
      # The bridge and client run against these functions; a route or validator change must run the suite.
      - "convex/**"
      - "vitest.config.ts"
      - "bun.lock"
      - ".github/workflows/deploy-imsg.yml"
      - ".github/workflows/validate-imsg.yml"
  push:
    branches-ignore: [main]
    paths:
      - "apps/imsg/**"
      # The bridge and client run against these functions; a route or validator change must run the suite.
      - "convex/**"
      - "vitest.config.ts"
      - "bun.lock"
      - ".github/workflows/deploy-imsg.yml"
      - ".github/workflows/validate-imsg.yml"

concurrency:
  group: validate-imsg-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd apps/imsg
          bun install --frozen-lockfile --cwd apps/imsg/client
          bun install --frozen-lockfile --cwd apps/imsg/desktop
      - name: Typecheck
        run: bun run typecheck:imsg
      - name: Lint
        working-directory: apps/imsg
        run: bun run lint
      - name: Test
        working-directory: apps/imsg
        run: bun test
      - name: Convex comma functions and the bridge and agent contracts
        run: |
          bunx vitest run convex/comma
          bun test --timeout 60000 convex/comma/bridgeContract.test.ts convex/comma/agentContract.test.ts
      - name: Build fixture web export
        working-directory: apps/imsg
        run: bun run fixture:build
      - name: First-visit JS size ratchet
        working-directory: apps/imsg
        run: bun test ./scripts/bundle-size.ratchet.ts
      - name: Fixture browser suite (ratchets, iMessage golden paths, every fixture spec)
        working-directory: apps/imsg
        env:
          IMSG_FIXTURE_PREBUILT: "1"
        run: |
          bunx playwright install chromium-headless-shell
          bunx playwright test --config e2e/fixture.playwright.config.ts
      - name: Test desktop production guard
        env:
          COMMA_DEV_GUARDED: "1"
          COMMA_SOURCE_SHA: ${{ github.sha }}
        run: cargo test --manifest-path apps/imsg/desktop/src-tauri/Cargo.toml
