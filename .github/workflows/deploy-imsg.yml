name: Deploy imsg

on:
  push:
    branches: [main]
    paths:
      - "apps/imsg/**"
      - "bun.lock"
  workflow_dispatch: {}
# deploy.sh mutates the live checkout in place, so overlapping runs would
# corrupt each other (one job's `git checkout -- .` kills another's build).
# Serialize deploys. A running release owns its rollback state until completion;
# the next main push waits and then deploys the newer SHA.
concurrency:
  group: deploy-imsg
  cancel-in-progress: false
# NOTE: this only redeploys the imsg app (server + web client) on the Mini.
# It does NOT push Convex functions/schema — those live on Convex's managed
# cloud (project master-db, deployment shiny-gerbil-853) and are pushed
# separately via `bunx convex dev --once` (or `convex deploy`) from a machine
# with Convex CLI auth. If you want Convex changes (convex/**) to auto-deploy
# too, that needs its own workflow with a CONVEX_DEPLOY_KEY secret — ask
# before wiring that up, since it's a credential + "which deployment does
# this key target" decision worth confirming, not a call to make solo.

jobs:
  deploy:
    # Runs on the self-hosted runner living on the same Mac Mini that serves
    # imsg — no actions/checkout: the live app runs in place out of
    # ~/Programming/Repos/master-db, so the job just invokes that checkout's
    # own deploy script, which does the git pull itself.
    runs-on: [self-hosted, imsg-mini]
    timeout-minutes: 30
    steps:
      - name: Sync exact main and deploy
        run: |
          REPO="$HOME/Programming/Repos/master-db"
          git -C "$REPO" checkout -- .
          git -C "$REPO" fetch origin main
          git -C "$REPO" checkout main
          git -C "$REPO" pull --ff-only origin main
          exec bash "$REPO/apps/imsg/scripts/deploy.sh" --already-synced

      - name: Publish release identity
        if: always()
        run: |
          URL="https://milads-mac-mini.taild31e9a.ts.net:8447"
          {
            echo "## Comma deployment"
            echo
            echo '```json'
            curl -sf "$URL/api/deploy/status" || echo '{"web":"unavailable"}'
            curl -sf "$URL/api/desktop-version" || echo '{"shell":"unavailable"}'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
